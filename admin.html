<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배너 관리 · MIKS&T</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1437;--panel:#141d47;--panel2:#0d1a3f;--gold:#C9A84C;--teal:#2DD4BF;--line:#2a3566;--body:'Inter','Noto Sans KR',sans-serif;--disp:'Space Grotesk','Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--ink);color:#dfe4f2;line-height:1.55;padding:0 0 80px}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--disp);color:#fff}
.top{position:sticky;top:0;z-index:10;background:rgba(11,20,55,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 22px;display:flex;align-items:center;gap:14px}
.top h1{font-size:1.12rem}
.top .sp{margin-left:auto}
.wrap{max-width:920px;margin:26px auto;padding:0 20px}
.btn{font-family:var(--body);font-weight:600;border:0;border-radius:9px;padding:10px 18px;cursor:pointer;font-size:.92rem}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.24);color:#dfe4f2}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:6px 11px;font-size:.82rem;border-radius:7px}
.btn-danger{background:transparent;border:1px solid #6b2a30;color:#ff8a8f}
.btn-danger:hover{background:#3a1114}
input,textarea{width:100%;font-family:var(--body);font-size:.92rem;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px 11px}
input:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical;min-height:52px}
label{display:block;font-size:.76rem;color:#9aa3c4;margin:0 0 4px;font-weight:600}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;margin-bottom:18px}
.card.slide{border-left:3px solid var(--gold)}
.slide-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.slide-head .idx{font-family:var(--mono,monospace);color:var(--gold);font-weight:700}
.slide-head .thumb{width:76px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
.slide-head .tt{font-family:var(--disp);color:#fff;font-weight:600}
.slide-head .ops{margin-left:auto;display:flex;gap:7px}
.row-vis{display:flex;align-items:center;gap:8px;margin-top:6px}
.row-vis input{width:auto}
.msg{padding:11px 15px;border-radius:9px;margin-bottom:16px;font-size:.9rem;display:none}
.msg.ok{background:#0f2e28;border:1px solid var(--teal);color:#8ff0e2;display:block}
.msg.err{background:#3a1114;border:1px solid #6b2a30;color:#ff9a9e;display:block}
.msg.info{background:#12204d;border:1px solid var(--line);color:#bcc6e6;display:block}
#login{max-width:380px;margin:12vh auto 0;padding:0 20px}
#login .card{padding:26px}
.hide{display:none!important}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.hint{font-size:.8rem;color:#8b93b3;margin-top:4px}
.up-status{font-size:.78rem;color:var(--teal);margin-top:4px;min-height:1em}
.who{font-size:.85rem;color:#9aa3c4}
.who b{color:var(--gold)}
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="login">
  <h1 style="font-family:var(--disp);text-align:center;margin-bottom:6px">MIKS&amp;T 배너 관리</h1>
  <p style="text-align:center;color:#9aa3c4;margin-bottom:22px;font-size:.9rem">관리자 계정으로 로그인하세요</p>
  <div class="card">
    <div id="loginMsg" class="msg"></div>
    <div class="field"><label>이메일</label><input id="email" type="email" autocomplete="username" placeholder="johnnie@miksnt.com"></div>
    <div class="field"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-gold" id="loginBtn" style="width:100%;margin-top:6px">로그인</button>
    <button class="btn btn-ghost" id="signupBtn" style="width:100%;margin-top:10px">계정 만들기 (최초 1회)</button>
    <p class="hint" style="text-align:center;margin-top:14px">관리자: johnnie@miksnt.com</p>
  </div>
</div>

<!-- ===== Admin ===== -->
<div id="admin" class="hide">
  <div class="top">
    <h1>배너 관리</h1>
    <span class="who" id="who"></span>
    <span class="sp"></span>
    <a href="index.html" class="btn btn-ghost btn-sm" target="_blank" style="text-decoration:none">사이트 미리보기 ↗</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">로그아웃</button>
  </div>
  <div class="wrap">
    <div id="msg" class="msg"></div>

    <div class="bar">
      <div>
        <label style="margin-bottom:2px">자동 넘김 간격 (초)</label>
        <input id="interval" type="number" min="2" step="1" style="width:120px">
      </div>
      <span class="sp" style="margin-left:auto"></span>
      <button class="btn btn-ghost" id="addBtn">+ 슬라이드 추가</button>
      <button class="btn btn-gold" id="saveBtn">저장</button>
    </div>

    <div id="slides"></div>

    <div style="text-align:center;margin-top:8px">
      <button class="btn btn-gold" id="saveBtn2">저장</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:18px">이미지는 파일명(예: <span class="mono">banner-ai.svg</span>) 또는 이미지 URL을 넣으면 됩니다. 파일 업로드도 가능(스토리지 미설정 시 URL 사용).</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCnJcOR2Up0Kt1jFCjubnqepZHW7h4wO48",authDomain:"miks-def1e.firebaseapp.com",projectId:"miks-def1e",storageBucket:"miks-def1e.firebasestorage.app",messagingSenderId:"607535742143",appId:"1:607535742143:web:0f1c7e7d2ccdb7549cda0a",measurementId:"G-X7YE5S8G2S"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let storage=null; try{storage=firebase.storage();}catch(e){}

const ADMIN_EMAILS=['johnnie@miksnt.com'];
const isAdmin=u=>!!u&&ADMIN_EMAILS.includes((u.email||'').toLowerCase());

const DEFAULT_BANNER={interval:6000,slides:[
  {img:"banner-ai.svg",tagKo:"",tagEn:"",titleKo:"AI 전문 기업",titleEn:"AI specialists",subKo:"머신러닝과 컴퓨터비전으로 현장의 문제를 푸는 기술을 만듭니다.",subEn:"We build machine-learning and computer-vision technology that solves real-world problems.",ctaKo:"",ctaEn:"",link:"",visible:true},
  {img:"banner-cloud.svg",tagKo:"",tagEn:"",titleKo:"클라우드 솔루션 개발 전문",titleEn:"Cloud solution builders",subKo:"설계부터 운영까지, 확장 가능한 클라우드 인프라를 직접 구축합니다.",subEn:"From architecture to operations, we build scalable cloud infrastructure end to end.",ctaKo:"",ctaEn:"",link:"",visible:true},
  {img:"banner-cloudbridge.svg",tagKo:"우리 제품",tagEn:"Our product",titleKo:"CloudBridge",titleEn:"CloudBridge",subKo:"위·변조를 탐지하는 검증 가능한 클라우드 영상 인프라.",subEn:"Verifiable cloud video infrastructure that detects tampering.",ctaKo:"CloudBridge 살펴보기",ctaEn:"Explore CloudBridge",link:"#cloudbridge",visible:true},
  {img:"banner-veridash.svg",tagKo:"우리 제품",tagEn:"Our product",titleKo:"VeriDash",titleEn:"VeriDash",subKo:"무결성 체인으로 봉인하는 블랙박스 — 검증 가능한 영상 증거.",subEn:"An integrity-sealed dashcam — verifiable video evidence.",ctaKo:"VeriDash 살펴보기",ctaEn:"Explore VeriDash",link:"#veridash",visible:true}
]};

let model={interval:6000,slides:[]};
const $=id=>document.getElementById(id);
function loginMsg(t,c){const m=$('loginMsg');m.textContent=t;m.className='msg '+c;}
function msg(t,c){const m=$('msg');m.textContent=t;m.className='msg '+c;if(c==='ok')setTimeout(()=>m.className='msg',4000);}

/* ---- auth ---- */
$('loginBtn').onclick=()=>{ loginMsg('로그인 중…','info');
  auth.signInWithEmailAndPassword($('email').value.trim(),$('pw').value)
    .catch(e=>loginMsg('로그인 실패: '+e.message,'err')); };
$('signupBtn').onclick=()=>{ const em=$('email').value.trim().toLowerCase();
  if(!ADMIN_EMAILS.includes(em)){loginMsg('이 이메일은 관리자로 등록되어 있지 않습니다.','err');return;}
  loginMsg('계정 생성 중…','info');
  auth.createUserWithEmailAndPassword(em,$('pw').value)
    .then(()=>loginMsg('계정이 생성되었습니다. 로그인됩니다.','ok'))
    .catch(e=>loginMsg('생성 실패: '+e.message,'err')); };
$('logoutBtn').onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  if(isAdmin(u)){
    $('login').classList.add('hide'); $('admin').classList.remove('hide');
    $('who').innerHTML='로그인: <b>'+u.email+'</b>';
    loadBanner();
  }else{
    $('admin').classList.add('hide'); $('login').classList.remove('hide');
    if(u){ loginMsg('이 계정('+u.email+')은 관리자 권한이 없습니다.','err'); auth.signOut(); }
  }
});

/* ---- load / render ---- */
function loadBanner(){
  db.collection('siteContent').doc('banner').get().then(d=>{
    if(d.exists && d.data() && Array.isArray(d.data().slides) && d.data().slides.length){
      model=JSON.parse(JSON.stringify(d.data()));
    }else{
      model=JSON.parse(JSON.stringify(DEFAULT_BANNER));
      msg('저장된 배너가 없어 기본값을 불러왔습니다. 수정 후 저장하세요.','info');
    }
    if(!model.slides)model.slides=[];
    $('interval').value=Math.round((Number(model.interval)||6000)/1000);
    render();
  }).catch(e=>msg('불러오기 실패: '+e.message,'err'));
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function field(k,label,val,ta){
  return `<div class="field"><label>${label}</label>${ta
    ?`<textarea data-k="${k}">${esc(val)}</textarea>`
    :`<input data-k="${k}" value="${esc(val)}">`}</div>`;
}
function render(){
  const box=$('slides'); box.innerHTML='';
  model.slides.forEach((s,i)=>{
    const c=document.createElement('div'); c.className='card slide'; c.dataset.i=i;
    c.innerHTML=`
      <div class="slide-head">
        <span class="idx">#${i+1}</span>
        <img class="thumb" src="${esc(s.img||'')}" alt="" onerror="this.style.opacity=.25">
        <span class="tt">${esc(s.titleKo||s.titleEn||'(제목 없음)')}</span>
        <span class="ops">
          <button class="btn btn-ghost btn-sm" data-op="up" ${i===0?'disabled':''}>↑</button>
          <button class="btn btn-ghost btn-sm" data-op="down" ${i===model.slides.length-1?'disabled':''}>↓</button>
          <button class="btn btn-danger btn-sm" data-op="del">삭제</button>
        </span>
      </div>
      <div class="field"><label>이미지 (파일명 또는 URL)</label><input data-k="img" value="${esc(s.img||'')}"></div>
      <div class="field"><label>이미지 파일 업로드 (선택)</label><input type="file" accept="image/*" data-op="file"><div class="up-status" data-op="upstat"></div></div>
      <div class="grid2">
        ${field('tagKo','태그 (KO, 선택)',s.tagKo||'')}
        ${field('tagEn','태그 (EN, 선택)',s.tagEn||'')}
        ${field('titleKo','제목 (KO)',s.titleKo||'')}
        ${field('titleEn','제목 (EN)',s.titleEn||'')}
      </div>
      ${field('subKo','설명 (KO)',s.subKo||'',1)}
      ${field('subEn','설명 (EN)',s.subEn||'',1)}
      <div class="grid2">
        ${field('ctaKo','버튼 문구 (KO, 선택)',s.ctaKo||'')}
        ${field('ctaEn','버튼 문구 (EN, 선택)',s.ctaEn||'')}
      </div>
      ${field('link','버튼 링크 (예: #cloudbridge, https://…)',s.link||'')}
      <div class="row-vis"><input type="checkbox" data-k="visible" ${s.visible!==false?'checked':''}><label style="margin:0">사이트에 노출</label></div>
    `;
    box.appendChild(c);
  });
}

/* collect edits from DOM into model before ops/save */
function collect(){
  model.interval=(Number($('interval').value)||6)*1000;
  document.querySelectorAll('#slides .card.slide').forEach(c=>{
    const i=+c.dataset.i, s=model.slides[i]; if(!s)return;
    c.querySelectorAll('[data-k]').forEach(el=>{
      const k=el.dataset.k;
      s[k]= el.type==='checkbox'? el.checked : el.value;
    });
  });
}

/* ---- ops (event delegation) ---- */
$('slides').addEventListener('click',e=>{
  const btn=e.target.closest('[data-op]'); if(!btn||btn.dataset.op==='file'||btn.dataset.op==='upstat')return;
  const card=e.target.closest('.card.slide'); const i=+card.dataset.i;
  collect();
  if(btn.dataset.op==='del'){ if(confirm('이 슬라이드를 삭제할까요?')){model.slides.splice(i,1);render();} }
  else if(btn.dataset.op==='up'&&i>0){ [model.slides[i-1],model.slides[i]]=[model.slides[i],model.slides[i-1]]; render(); }
  else if(btn.dataset.op==='down'&&i<model.slides.length-1){ [model.slides[i+1],model.slides[i]]=[model.slides[i],model.slides[i+1]]; render(); }
});

/* ---- file upload ---- */
$('slides').addEventListener('change',e=>{
  const inp=e.target.closest('input[type=file]'); if(!inp)return;
  const file=inp.files&&inp.files[0]; if(!file)return;
  const card=e.target.closest('.card.slide'); const i=+card.dataset.i;
  const stat=card.querySelector('[data-op="upstat"]');
  if(!storage){stat.textContent='스토리지 미설정 — 이미지 URL을 직접 입력하세요.';return;}
  stat.textContent='업로드 중…';
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const ref=storage.ref().child('uploads/banner/'+Date.now()+'_'+safe);
  ref.put(file).then(s=>s.ref.getDownloadURL()).then(url=>{
    collect(); model.slides[i].img=url; render();
    msg('이미지 업로드 완료','ok');
  }).catch(err=>{ stat.textContent='업로드 실패: '+err.message+' — URL을 직접 입력하세요.'; });
});

/* ---- add / save ---- */
$('addBtn').onclick=()=>{ collect();
  model.slides.push({img:'',tagKo:'',tagEn:'',titleKo:'새 슬라이드',titleEn:'New slide',subKo:'',subEn:'',ctaKo:'',ctaEn:'',link:'',visible:true});
  render(); window.scrollTo(0,document.body.scrollHeight); };

function save(){ collect();
  const payload=JSON.parse(JSON.stringify(model));
  payload.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  msg('저장 중…','info');
  db.collection('siteContent').doc('banner').set(payload)
    .then(()=>msg('저장되었습니다. 홈페이지에 반영됩니다.','ok'))
    .catch(e=>msg('저장 실패: '+e.message+' (Firestore 규칙 확인)','err'));
}
$('saveBtn').onclick=save; $('saveBtn2').onclick=save;
</script>
</body>
</html>
