      <g transform="rotate(45 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(90 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(135 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(180 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(225 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(270 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
      <g transform="rotate(315 1250 340)"><rect x="1234" y="216" width="32" height="34" rx="6"/></g>
