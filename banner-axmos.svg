<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" role="img" aria-label="AXMOS">
  <defs>
    <linearGradient id="bgx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1437"/><stop offset="1" stop-color="#132258"/>
    </linearGradient>
    <linearGradient id="scrimx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1437" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#0B1437" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0B1437" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowx" cx="0.76" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C9A84C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
