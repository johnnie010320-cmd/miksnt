<svg xmlns="http://www.w3.org/2000/svg" viewBox="890 95 660 510" width="660" height="510" role="img" aria-label="Integrity dashcam">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2537"/><stop offset="1" stop-color="#0f2a3e"/>
    </linearGradient>
    <linearGradient id="scrim4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2537" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#0F2537" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0F2537" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c3a54"/><stop offset="1" stop-color="#0F2537"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="680" fill="url(#bg4)"/>
  <!-- dashcam frame -->
  <g transform="translate(940 130)">
    <rect x="0" y="0" width="560" height="420" rx="18" fill="#0b2234" stroke="#0369A1" stroke-width="2.5"/>
    <!-- road inside -->
    <clipPath id="clip4"><rect x="8" y="8" width="544" height="404" rx="14"/></clipPath>
    <g clip-path="url(#clip4)">
      <rect x="8" y="200" width="544" height="212" fill="url(#road)"/>
      <path d="M280 412 L250 200 M280 412 L310 200" stroke="#274a63" stroke-width="6"/>
      <g stroke="#0284C7" stroke-width="7" stroke-linecap="round">
        <path d="M280 400 L280 360"/><path d="M280 330 L280 300"/><path d="M280 280 L280 258"/>
      </g>
      <!-- horizon glow -->
      <ellipse cx="280" cy="200" rx="220" ry="30" fill="#22D3EE" opacity="0.12"/>
    </g>
    <!-- REC + timestamp -->
    <circle cx="34" cy="34" r="9" fill="#e5484d"/>
    <text x="52" y="40" font-family="monospace" font-size="20" fill="#e6ebf5">REC</text>
    <text x="360" y="40" font-family="monospace" font-size="18" fill="#8ea2c9">00:41:07</text>
    <!-- GPS pin -->
    <g transform="translate(470 300)">
      <path d="M0 -34 a24 24 0 1 1 0.01 0 Z L0 8 Z" fill="#22D3EE"/>
      <circle cx="0" cy="-34" r="10" fill="#0F2537"/>
    </g>
  </g>
  <!-- sealed clip chip -->
  <g transform="translate(1010 500)">
    <rect x="0" y="0" width="330" height="70" rx="35" fill="#102a3e" stroke="#0284C7" stroke-width="2.5"/>
    <g transform="translate(20 12)">
      <circle cx="23" cy="23" r="22" fill="none" stroke="#0284C7" stroke-width="3"/>
      <path d="M13 24 L20 31 L34 15" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="72" y="34" font-family="monospace" font-size="15" fill="#e6ebf5">clip sealed</text>
    <text x="72" y="54" font-family="monospace" font-size="14" fill="#22D3EE">sha256 · 9af2 5d10</text>
  </g>
</svg>
