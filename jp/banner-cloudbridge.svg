<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" role="img" aria-label="CloudBridge">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08122e"/><stop offset="1" stop-color="#122052"/>
    </linearGradient>
    <linearGradient id="scrim3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08122e" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#08122e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#08122e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.75" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="680" fill="url(#bg3)"/>
  <rect width="1600" height="680" fill="url(#glow3)"/>
  <!-- camera -->
  <g transform="translate(960 250)">
    <rect x="0" y="0" width="150" height="92" rx="14" fill="#141d47" stroke="#3949AB" stroke-width="2"/>
    <circle cx="70" cy="46" r="34" fill="#0B1437" stroke="#2DD4BF" stroke-width="4"/>
    <circle cx="70" cy="46" r="16" fill="#2DD4BF" opacity="0.85"/>
    <rect x="150" y="30" width="34" height="32" rx="5" fill="#3949AB"/>
    <circle cx="128" cy="20" r="5" fill="#C9A84C"/>
  </g>
  <!-- bridge arc to cloud -->
  <path d="M1150 300 Q1250 200 1340 250" fill="none" stroke="#C9A84C" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- cloud -->
  <path d="M1300 250 a70 70 0 0 1 136 -22 a54 54 0 0 1 20 104 H1320 a60 60 0 0 1 -20 -82 Z"
        fill="none" stroke="#2DD4BF" stroke-width="3.5"/>
  <!-- hash chain blocks -->
  <g transform="translate(980 470)">
    <g font-family="monospace" font-size="13" fill="#2DD4BF">
      <g>
        <rect x="0" y="0" width="118" height="84" rx="10" fill="#0d1a3f" stroke="#2DD4BF" stroke-width="2"/>
        <text x="12" y="26" fill="#8ea2c9">block 1</text>
        <text x="12" y="50">a1f9</text><text x="12" y="68">7c2b</text>
      </g>
      <g transform="translate(160 0)">
        <rect x="0" y="0" width="118" height="84" rx="10" fill="#0d1a3f" stroke="#2DD4BF" stroke-width="2"/>
        <text x="12" y="26" fill="#8ea2c9">block 2</text>
        <text x="12" y="50">e04d</text><text x="12" y="68">bb81</text>
      </g>
      <g transform="translate(320 0)">
        <rect x="0" y="0" width="118" height="84" rx="10" fill="#0d1a3f" stroke="#C9A84C" stroke-width="2.5"/>
        <text x="12" y="26" fill="#8ea2c9">block 3</text>
        <text x="12" y="50" fill="#C9A84C">9af2</text><text x="12" y="68" fill="#C9A84C">5d10</text>
      </g>
    </g>
    <g stroke="#C9A84C" stroke-width="3">
      <path d="M118 42 H160"/><path d="M278 42 H320"/>
    </g>
    <!-- verified seal -->
    <g transform="translate(470 20)">
      <circle cx="22" cy="22" r="24" fill="none" stroke="#C9A84C" stroke-width="3"/>
      <path d="M11 23 L19 31 L34 14" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect width="960" height="680" fill="url(#scrim3)"/>
</svg>
